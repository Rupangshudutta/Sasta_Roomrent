name: Database migrate (production)

# Runs the idempotent migration against the production database using the
# repository secrets. Trigger it from the Actions tab (or `gh workflow run`)
# after setting the secrets, and any time the schema changes.
#
# Required repository secrets:
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD, ADMIN_EMAIL, ADMIN_PASSWORD

on:
  workflow_dispatch:
    inputs:
      seed_demo:
        description: "Also insert the 6 demo listings (only if none exist)"
        type: boolean
        default: false
      cleanup_smoke:
        description: "Remove accounts/listings left by the smoke test"
        type: boolean
        default: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SSL: "true"
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      JWT_SECRET: not-needed-for-migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --include=dev --prefix backend
      - run: npm run build --prefix backend
      - name: Migrate
        run: npm run migrate --prefix backend
      - name: Seed demo listings
        if: ${{ inputs.seed_demo }}
        run: npm run seed:demo --prefix backend
      - name: Cleanup smoke-test data
        if: ${{ inputs.cleanup_smoke }}
        run: npm run cleanup:smoke --prefix backend

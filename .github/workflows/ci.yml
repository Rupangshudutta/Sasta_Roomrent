name: CI

on:
  push:
    branches: [Rupangshu-Dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build-time public config. Real values come from repository variables when set;
  # the fallbacks keep CI green on forks and before secrets exist.
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://sastaroomrent.netlify.app' }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://zwnfcvpqxdnvdqrdihed.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}

jobs:
  quality:
    name: Typecheck, lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test

  database:
    name: Migrations, RLS and lifecycle tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply migrations + seed and run SQL tests on plain Postgres
        run: bash scripts/db/test.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Generated types are up to date
        run: |
          npm run db:types
          git diff --exit-code -- types/database.types.ts || {
            echo "::error::types/database.types.ts is stale. Run 'npm run db:test && npm run db:types' and commit."; exit 1; }
        env:
          # The Supabase CLI defaults to TLS; the CI service container is plaintext.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sasta_room_test?sslmode=disable

  build-and-e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    needs: [quality, database]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fail if the client bundle references localhost or contains a secret key value
        # supabase-js legitimately mentions the "sb_secret_" prefix in a warning string, so the
        # scan looks for an actual key value (prefix + 20 or more key characters).
        run: bash scripts/ci/scan-bundle.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

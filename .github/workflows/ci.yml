name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build API + Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm run install:all
      - name: Build API
        run: npm run build:api
      - name: Build Web (production)
        run: npm run build:web
      - name: Verify production bundle does not point at localhost
        run: |
          if grep -rl "localhost:3000" frontend/dist/sasta-room-frontend/browser/*.js; then
            echo "Production bundle contains localhost API URL"; exit 1; fi
          echo "OK"

  api-e2e:
    name: API end-to-end (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sasta_room
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: sasta_room
      DB_USER: root
      DB_PASSWORD: root
      DB_SSL: "false"
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: CiAdmin12345!
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix backend
      - run: npm run build --prefix backend
      - name: Migrate (twice, must be idempotent)
        run: npm run migrate --prefix backend && npm run migrate --prefix backend
      - name: Start API
        run: |
          (cd backend && node dist/app.js > api.log 2>&1 &)
          for i in $(seq 1 20); do curl -sf http://localhost:3000/api/health && break || sleep 1; done
      - name: Smoke test (full loop)
        env:
          BASE_URL: http://localhost:3000
          SMOKE_ADMIN_EMAIL: admin@ci.local
          SMOKE_ADMIN_PASSWORD: CiAdmin12345!
        run: node backend/scripts/smoke.mjs
      - name: API log
        if: always()
        run: cat backend/api.log || true
